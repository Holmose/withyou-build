name: build-and-publish-multiarch

on:
  workflow_dispatch:
    inputs:
      git_commit:
        description: "源码 commit SHA（默认 HEAD）"
        required: false
        default: ""
      go_image:
        description: "Go 基础镜像（multi-arch，含 amd64+arm64）"
        required: false
        default: "golang:1.26-bookworm"
  push:
    branches: [ main ]

jobs:
  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 1

      - name: Resolve build args
        id: args
        run: |
          if [ -z "${{ inputs.git_commit }}" ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${{ inputs.git_commit }}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync version from root VERSION
        working-directory: .
        run: node scripts/sync-version.mjs frontend

      - name: Build frontend static
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GO_IMAGE=${{ inputs.go_image }}
            GIT_COMMIT=${{ steps.args.outputs.commit }}
            BUILD_TIME=${{ steps.args.outputs.build_time }}
          tags: |
            registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:v2.2.34-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Clone private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 1

      - name: Resolve build args
        id: args
        run: |
          if [ -z "${{ inputs.git_commit }}" ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${{ inputs.git_commit }}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync version from root VERSION
        working-directory: .
        run: node scripts/sync-version.mjs frontend

      - name: Build frontend static
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            GO_IMAGE=${{ inputs.go_image }}
            GIT_COMMIT=${{ steps.args.outputs.commit }}
            BUILD_TIME=${{ steps.args.outputs.build_time }}
          tags: |
            registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:v2.2.34-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge-manifest:
    name: Merge manifest list
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:v2.2.34 \
            -t registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:latest \
            registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:v2.2.34-amd64 \
            registry.cn-beijing.aliyuncs.com/withyou_holmose/deeix-chat-withyou:v2.2.34-arm64